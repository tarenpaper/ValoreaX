[project]
name = "valorea-backend"
version = "0.1.0"
description = "ValoreaX — local-first healthcare equity research backend (educational, not investment advice)"
requires-python = ">=3.12"
readme = "../README.md"
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-Cors>=4.0",
    "Flask-SQLAlchemy>=3.1",
    "SQLAlchemy>=2.0,<3.0",
    "marshmallow>=3.20,<4.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "alembic>=1.14,<2.0",
    "pandas>=2.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "gunicorn>=21.2",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.6,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, comprehensions, pyupgrade
select = ["E", "F", "I", "B", "C4", "UP"]
# E501: line length handled by formatter. UP042: (str, Enum) is intentional so
# members serialize/compare as their string values across the ORM + JSON layers.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
